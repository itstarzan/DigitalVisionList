name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true :app:assembleRelease --no-daemon

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Locate and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          mkdir -p signed
          zipalign -f -p 4 "$APK" signed/DigitalVisionList-release-aligned.apk

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > signing.jks
          chmod 600 signing.jks

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$APKSIGNER"

          "$APKSIGNER" sign             --ks signing.jks             --ks-key-alias "$KEY_ALIAS"             --ks-pass env:KEYSTORE_PASSWORD             --key-pass env:KEY_PASSWORD             --out signed/DigitalVisionList-release.apk             signed/DigitalVisionList-release-aligned.apk

          "$APKSIGNER" verify --verbose signed/DigitalVisionList-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalVisionList-release
          path: signed/DigitalVisionList-release.apk
          if-no-files-found: error

      - name: Clean signing material
        if: always()
        run: rm -f signing.jks signed/DigitalVisionList-release-aligned.apk
